<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Noor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d14;
    --ink: #ece7dd;
    --muted: #8d8a85;
    --gold: #d9b877;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #161a29 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .screen {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center;
    transition: opacity 1.4s ease;
  }
  .hidden { opacity: 0; pointer-events: none; position: absolute; inset: 0; visibility: hidden; }

  /* ---------- Intro ---------- */
  .eyebrow {
    font-size: 15px; letter-spacing: .45em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: rise 2s ease .4s forwards;
  }
  .name {
    font-weight: 300; font-size: clamp(64px, 18vw, 140px); letter-spacing: .08em;
    margin: 18px 0 34px; color: var(--ink);
    text-shadow: 0 0 40px rgba(217, 184, 119, .35);
    opacity: 0; animation: rise 2.4s ease 1.2s forwards, glow 6s ease-in-out 3.6s infinite;
  }
  .btn {
    font-family: inherit; font-size: 15px; letter-spacing: .35em; text-transform: uppercase;
    color: var(--gold); background: transparent;
    border: 1px solid rgba(217, 184, 119, .5); padding: 14px 34px; cursor: pointer;
    opacity: 0; animation: rise 2s ease 2.6s forwards;
    transition: background .5s, color .5s, border-color .5s;
  }
  .btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  /* ---------- Lyrics ---------- */
  #stage { padding-bottom: 150px; }
  #lyrics { width: 100%; max-width: 560px; direction: rtl; }
  .line {
    font-family: "Amiri", serif; font-size: clamp(21px, 5.6vw, 27px); line-height: 1.95;
    min-height: 1.95em; color: var(--ink);
    opacity: .45; transition: opacity 1.2s ease;
  }
  .line.active { opacity: 1; }
  .line span { display: inline-block; opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .7s ease; }
  .line span.show { opacity: 1; transform: none; }

  /* ---------- Signature ---------- */
  .signature {
    font-family: "Aref Ruqaa", "Amiri", serif; font-weight: 700;
    font-size: clamp(38px, 11vw, 58px); color: var(--gold);
    direction: rtl; transform: rotate(-5deg); margin-top: 26px;
    text-shadow: 0 0 24px rgba(217, 184, 119, .3);
    clip-path: inset(0 0 0 100%); transition: clip-path 2.6s ease-out;
  }
  .signature.show { clip-path: inset(0 0 0 0); }
  #replay {
    margin-top: 26px; font-size: 13px; padding: 10px 24px; animation: none;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease, background .5s, color .5s;
  }
  #replay.show { opacity: 1; pointer-events: auto; }

  /* ---------- Waveform ---------- */
  #wave {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; height: 110px;
    padding: 0 20px 26px; display: flex; align-items: flex-end; justify-content: center; gap: 3px;
    background: linear-gradient(to top, rgba(11, 13, 20, .95), rgba(11, 13, 20, 0));
    opacity: 0; transition: opacity 2s ease; pointer-events: none;
  }
  #wave.on { opacity: 1; }
  #wave i {
    display: block; flex: 1 1 0; max-width: 6px; min-width: 2px; border-radius: 2px;
    background: rgba(236, 231, 221, .22); transition: background .3s, transform .15s;
    transform-origin: bottom;
  }
  #wave i.played { background: var(--gold); }
  #wave i.now { background: #fff; transform: scaleY(1.12); }

  /* ---------- Sync helper (?sync) ---------- */
  #sync {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9; padding: 10px 14px;
    background: #000c; color: #fff; font: 14px/1.5 system-ui, sans-serif; text-align: left; direction: ltr;
  }
  #sync textarea { width: 100%; height: 70px; margin-top: 6px; font: 12px monospace; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 40px rgba(217, 184, 119, .25); }
    50%      { text-shadow: 0 0 70px rgba(217, 184, 119, .6); }
  }
  @media (prefers-reduced-motion: reduce) {
    .signature { transition-duration: .01s; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- The song part (1:40 → 2:15) cut from the full track -->
<audio id="audio" src="song.mp3" preload="auto" playsinline></audio>

<section id="intro" class="screen">
  <div class="eyebrow">Something for you</div>
  <h1 class="name">Noor</h1>
  <button class="btn" id="open">Open</button>
</section>

<section id="stage" class="screen hidden">
  <div id="lyrics"></div>
  <div class="signature" id="signature">من إبراهيم</div>
  <button class="btn" id="replay">Replay</button>
</section>

<div id="wave"></div>

<script>
  /* =====================================================================
     LYRICS + TIMING
     STARTS[i]  = second (inside song.mp3) where line i starts being sung.
     If the typing is a little off, open the page with  ?sync  at the end of the
     link, tap once at the start of each line while the song plays, and send me
     the numbers it prints (or paste them into STARTS below).
     ===================================================================== */
  const LYRICS = [
    "لو يرجع فينا الزمان",
    "ما بخلي ولا مكان",
    "بقلب عليكي كل عمان",
    "بسأل عنك كل إنسان",
    "نسينا وصار اللي صار",
    "لقيتك وكان اللي كان",
    "وإنتي اليوم بين إيدي",
    "ليش ما عرفتك من زمان",
    "عطيتك قلبي وكمان"
  ];
  const STARTS = [5.0, 8.4, 11.8, 15.2, 18.6, 22.0, 25.4, 28.8, 32.2];   // first line starts 5s after play
  const LAST_LINE_LEN = 3.4;   // seconds the final line takes to sing
  const GAP = 0.35;            // breath before the next line

  /* peaks of song.mp3 for the waveform */
  const PEAKS = [58,83,73,76,79,52,52,84,84,87,71,69,84,93,90,100,64,62,72,59,73,82,89,86,65,62,87,91,92,87,79,70,83,90,81,93,94,70,77,97,90,91,90,74,69,91,95,92,77,78,67,84,85,83,88,89,62,71,87,88,90,85,78,78,89,91,90,78,88,80,85,77,86,92,91,69,74,95,91,95,87,78,77,82,62,63,82,81,75,73,88,90,84,56,35,19];

  /* ---------- Quiet starfield ---------- */
  (function () {
    const c = document.getElementById('stars'), ctx = c.getContext('2d');
    let w, h, stars = [];
    function resize() {
      w = c.width = innerWidth * devicePixelRatio;
      h = c.height = innerHeight * devicePixelRatio;
      stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: (Math.random() * 1.1 + .3) * devicePixelRatio,
        a: Math.random() * Math.PI * 2, s: Math.random() * .012 + .003
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.a += s.s;
        ctx.globalAlpha = .25 + .5 * Math.abs(Math.sin(s.a));
        ctx.fillStyle = '#f3ecd9';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    addEventListener('resize', resize); resize(); draw();
  })();

  /* ---------- Build lyric lines + word timings ---------- */
  const audio = document.getElementById('audio');
  const box = document.getElementById('lyrics');
  const lineEls = LYRICS.map(text => {
    const d = document.createElement('div'); d.className = 'line';
    text.split(' ').forEach((w, k) => {
      if (k) d.appendChild(document.createTextNode(' '));
      const sp = document.createElement('span'); sp.textContent = w; d.appendChild(sp);
    });
    box.appendChild(d); return d;
  });
  const wordEls = lineEls.map(d => [...d.querySelectorAll('span')]);
  let lines = [];

  function buildTimings() {
    lines = LYRICS.map((text, i) => {
      const start = STARTS[i];
      const end = i + 1 < STARTS.length ? STARTS[i + 1] - GAP : start + LAST_LINE_LEN;
      const words = text.split(' ');
      const weights = words.map(w => w.length + 1.2);       // longer words take longer to sing
      const total = weights.reduce((a, b) => a + b, 0);
      let t = start;
      const ws = words.map((w, k) => {
        const d = (end - start) * weights[k] / total;
        const o = { text: w, s: t, e: t + d }; t += d; return o;
      });
      return { start, end, words: ws };
    });
  }
  buildTimings();

  function render(t) {
    let active = -1;
    lines.forEach((ln, i) => {
      ln.words.forEach((w, k) => wordEls[i][k].classList.toggle('show', t >= w.s));
      if (t >= ln.start && (i === lines.length - 1 || t < lines[i + 1].start)) active = i;
    });
    lineEls.forEach((el, i) => el.classList.toggle('active', i === active && t < lines[i].end + 0.6));
  }

  /* ---------- Waveform ---------- */
  const wave = document.getElementById('wave');
  const bars = PEAKS.map(p => { const b = document.createElement('i'); b.style.height = (8 + p * 0.72) + 'px'; wave.appendChild(b); return b; });
  let lastIdx = -1;
  function paintWave(t) {
    const d = audio.duration || 37.2;
    const idx = Math.min(bars.length - 1, Math.floor(t / d * bars.length));
    if (idx === lastIdx) return;
    lastIdx = idx;
    bars.forEach((b, i) => { b.classList.toggle('played', i < idx); b.classList.toggle('now', i === idx); });
  }

  /* ---------- Playback ---------- */
  const sigEl = document.getElementById('signature');
  const replay = document.getElementById('replay');

  function fadeIn(to, ms) {
    audio.volume = 0;
    const t0 = performance.now();
    (function step(t) {
      const k = Math.min((t - t0) / ms, 1);
      audio.volume = to * k;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function loop() {
    const t = audio.currentTime;
    render(t); paintWave(t);
    if (!audio.paused && !audio.ended) requestAnimationFrame(loop);
  }

  audio.addEventListener('play', () => requestAnimationFrame(loop));
  audio.addEventListener('seeked', () => { const t = audio.currentTime; render(t); paintWave(t); });
  audio.addEventListener('ended', () => {
    render(1e9); paintWave(1e9);
    lineEls.forEach(el => el.classList.remove('active'));
    setTimeout(() => sigEl.classList.add('show'), 600);
    setTimeout(() => replay.classList.add('show'), 3600);
  });

  function startSong() {
    sigEl.classList.remove('show'); replay.classList.remove('show');
    render(0);
    audio.currentTime = 0;
    audio.play().then(() => fadeIn(0.9, 1200)).catch(() => {});
  }

  document.getElementById('open').addEventListener('click', () => {
    document.getElementById('intro').style.opacity = 0;
    setTimeout(() => {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('stage').classList.remove('hidden');
      wave.classList.add('on');
      startSong();
    }, 1200);
    // start the audio inside the click so mobile browsers allow it
    audio.volume = 0; audio.play().then(() => audio.pause()).catch(() => {});
  });
  replay.addEventListener('click', startSong);

  /* ---------- ?sync helper: tap once at the start of every line ---------- */
  if (location.search.includes('sync')) {
    const bar = document.createElement('div'); bar.id = 'sync'; document.body.appendChild(bar);
    let taps = [];
    const show = () => {
      bar.innerHTML = taps.length < LYRICS.length
        ? `SYNC MODE – press Open, then tap (or SPACE) exactly when line <b>${taps.length + 1}</b> starts: <b dir="rtl">${LYRICS[taps.length]}</b>`
        : `Done. Copy this and send it back:<textarea readonly>const STARTS = [${taps.join(', ')}];</textarea>`;
    };
    show();
    const tap = () => {
      if (audio.paused || taps.length >= LYRICS.length) return;
      taps.push(+audio.currentTime.toFixed(2)); show();
    };
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tap(); } });
    document.addEventListener('pointerdown', e => { if (e.target.id !== 'open' && e.target.tagName !== 'TEXTAREA') tap(); });
  }
</script>
</body>
</html>
