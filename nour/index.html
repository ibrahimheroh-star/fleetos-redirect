<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Noor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d14;
    --ink: #f3eee4;
    --muted: #b3afa6;
    --gold: #e0be7c;
    --blue: #4da3ff;
    --ew: 230px;                       /* envelope width */
    --eh: calc(var(--ew) * .64);       /* envelope height */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #161a29 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .screen {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center;
    transition: opacity 1.4s ease;
  }
  .hidden { opacity: 0; pointer-events: none; position: absolute; inset: 0; visibility: hidden; }

  /* ---------- Intro (wider, heavier type) ---------- */
  .eyebrow {
    font-weight: 600; font-size: clamp(15px, 4.2vw, 21px); letter-spacing: .36em; padding-left: .36em; white-space: nowrap;
    text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: rise 2s ease .4s forwards;
  }
  .name {
    font-weight: 700; font-size: clamp(80px, 24vw, 170px); letter-spacing: .1em; padding-left: .1em;
    margin: 14px 0 38px; color: var(--ink);
    text-shadow: 0 0 40px rgba(224, 190, 124, .35);
    opacity: 0; animation: rise 2.4s ease 1.2s forwards, glow 6s ease-in-out 3.6s infinite;
  }
  .btn {
    font-family: inherit; font-weight: 700; font-size: clamp(16px, 4.4vw, 20px);
    letter-spacing: .4em; padding: 18px 20px 18px calc(20px + .4em); text-transform: uppercase;
    min-width: 220px;
    color: var(--gold); background: transparent;
    border: 2px solid rgba(224, 190, 124, .7); cursor: pointer;
    opacity: 0; animation: rise 2s ease 2.6s forwards;
    transition: background .5s, color .5s, border-color .5s;
  }
  .btn:hover { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  /* ---------- Floating sentences ---------- */
  #lyrics {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; direction: rtl;
    clip-path: inset(0 0 100% 0);          /* JS opens it only above the letter's top edge */
  }
  .line {
    position: absolute; left: 0; right: 0; top: 100%; padding: 0 24px; text-align: center;
    font-family: "Amiri", serif; font-size: clamp(22px, 6vw, 30px); line-height: 1.9; color: var(--ink);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .85), 0 0 22px rgba(0, 0, 0, .7);
  }

  /* ---------- Hearts (only at "عطيتك قلبي وكمان", about 2 seconds) ---------- */
  #hearts { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  .heart { position: absolute; color: #ff5d7d; opacity: 0; filter: drop-shadow(0 0 8px rgba(255, 93, 125, .6)); }
  .heart svg { display: block; width: 100%; height: 100%; }

  /* ---------- Signature (under the letter) ---------- */
  #sig {
    position: fixed; left: 0; right: 0; z-index: 4; text-align: center;
    top: calc(50% + var(--eh) * .59 + 40px);
    font-family: "Aref Ruqaa", "Amiri", serif; font-weight: 700;
    font-size: clamp(36px, 10vw, 52px); color: var(--gold); direction: rtl;
    text-shadow: 0 0 24px rgba(224, 190, 124, .3);
    transform: rotate(-4deg);
    clip-path: inset(0 0 0 100%); transition: clip-path 2.6s ease-out;
  }
  #sig.show { clip-path: inset(0 0 0 0); }

  /* ---------- Envelope ---------- */
  #env {
    position: fixed; left: 50%; z-index: 4;
    width: var(--ew); height: var(--eh); margin-left: calc(var(--ew) / -2);
    bottom: calc(50% - var(--eh) / 2);
    perspective: 900px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    opacity: 0; pointer-events: none;
    transition: transform 1s cubic-bezier(.3, .7, .2, 1), opacity 1.6s ease;
  }
  #env.ready { opacity: 1; pointer-events: auto; }
  #env.open { transform: scale(1.18); }
  .env-inner { position: relative; width: 100%; height: 100%; animation: float 4s ease-in-out infinite; }
  #env.open .env-inner { animation: none; }
  .env-back {
    position: absolute; inset: 0; background: #e7e3d9; border-radius: 6px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 70px rgba(255, 255, 255, .10);
  }
  .env-front {
    position: absolute; inset: 0; border-radius: 6px; z-index: 2;
    background: #ffffff; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  }
  .env-front::after {            /* bottom fold, slightly darker */
    content: ""; position: absolute; inset: 0; background: #f3f1ea;
    clip-path: polygon(0 100%, 50% 46%, 100% 100%);
  }
  .env-flap {
    position: absolute; left: 0; top: 0; width: 100%; height: 56%; z-index: 3;
    background: linear-gradient(#ffffff 30%, #e9e5db); clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; transition: transform .9s cubic-bezier(.5, 0, .2, 1), z-index 0s;
  }
  #env.open .env-flap { transform: rotateX(180deg); z-index: 1; transition: transform .9s cubic-bezier(.5, 0, .2, 1), z-index 0s .45s; filter: brightness(.6); }
  .env-hint {
    position: absolute; top: calc(100% + 26px); left: 0; right: 0; text-align: center;
    font-weight: 600; font-size: 15px; letter-spacing: .4em; text-transform: uppercase; color: var(--muted);
    animation: pulse 2.4s ease-in-out infinite; transition: opacity .8s ease;
  }
  #env.open .env-hint { opacity: 0; animation: none; }

  /* ---------- Sound line (blue) ---------- */
  #scope {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; width: 100%; height: 100px;
    pointer-events: none; opacity: 0; transition: opacity 2s ease;
  }
  #scope.on { opacity: 1; }

  /* ---------- Sync helper (?sync) ---------- */
  #sync {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9; padding: 10px 14px;
    background: #000c; color: #fff; font: 14px/1.5 system-ui, sans-serif; text-align: left; direction: ltr;
  }
  #sync textarea { width: 100%; height: 70px; margin-top: 6px; font: 12px monospace; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 40px rgba(224, 190, 124, .25); }
    50%      { text-shadow: 0 0 70px rgba(224, 190, 124, .6); }
  }
  @media (max-height: 720px) { :root { --ew: 200px; } }
  @media (prefers-reduced-motion: reduce) { .signature { transition-duration: .01s; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- The song part (1:40 → 2:15) cut from the full track -->
<audio id="audio" src="song.mp3" preload="auto" playsinline></audio>

<section id="intro" class="screen">
  <div class="eyebrow">Something for you</div>
  <h1 class="name">Noor</h1>
  <button class="btn" id="open">Open</button>
</section>

<div id="lyrics"></div>
<div id="hearts"></div>
<div id="sig">من إبراهيم</div>

<div id="env" role="button" aria-label="Open the letter" tabindex="0">
  <div class="env-inner">
    <div class="env-back"></div>
    <div class="env-flap"></div>
    <div class="env-front"></div>
    <div class="env-hint" id="hint">Tap to open</div>
  </div>
</div>

<canvas id="scope"></canvas>

<script src="wave.js"></script>
<script>
  /* =====================================================================
     LYRICS + TIMING
     STARTS[i] = second (inside song.mp3) where line i is sung.
     If a line comes out a bit early/late, open the page with  ?sync  at the end
     of the link, tap once at the start of each line while the song plays, and send
     me the numbers it prints (or paste them into STARTS below).
     ===================================================================== */
  const LYRICS = [
    "لو يرجع فينا الزمان",
    "ما بخلي ولا مكان",
    "بقلب عليكي كل عمان",
    "بسأل عنك كل إنسان",
    "نسينا وصار اللي صار",
    "لقيتك وكان اللي كان",
    "وإنتي اليوم بين إيدي",
    "ليش ما عرفتك من زمان",
    "عطيتك قلبي وكمان"
  ];
  // seconds inside song.mp3 (clip = 1:40 → 2:15 of the original). Real times from the song:
  // 1:46, 1:48, 1:50, 1:53, 1:56, 1:58, 2:01, (2:03 instrumental gap), 2:06, 2:08
  const STARTS = [6, 8, 10, 13, 16, 18, 21, 26, 28];

  /* ---------- Quiet starfield ---------- */
  (function () {
    const c = document.getElementById('stars'), ctx = c.getContext('2d');
    let w, h, stars = [];
    function resize() {
      w = c.width = innerWidth * devicePixelRatio;
      h = c.height = innerHeight * devicePixelRatio;
      stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: (Math.random() * 1.1 + .3) * devicePixelRatio,
        a: Math.random() * Math.PI * 2, s: Math.random() * .012 + .003
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.a += s.s;
        ctx.globalAlpha = .25 + .5 * Math.abs(Math.sin(s.a));
        ctx.fillStyle = '#f3ecd9';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    addEventListener('resize', resize); resize(); draw();
  })();

  const audio = document.getElementById('audio');
  const env = document.getElementById('env');
  const hint = document.getElementById('hint');

  /* ---------- Sentences: ready-made text that floats out of the letter and up off the screen ---------- */
  const lyricsBox = document.getElementById('lyrics');
  const sigEl = document.getElementById('sig');
  const lineEls = LYRICS.map(text => {
    const d = document.createElement('div'); d.className = 'line'; d.textContent = text;
    lyricsBox.appendChild(d); return d;
  });
  const launched = LYRICS.map(() => false);
  const flights = [];
  const SPEED = 52;     // px per second that a sentence climbs
  const LEAD = 0.45;    // s: a sentence starts leaving the letter just before it is sung

  function launch(i) {
    const el = lineEls[i], e = env.getBoundingClientRect();
    // text is only visible above the letter's top edge, so it looks like it comes out of the letter
    lyricsBox.style.clipPath = `inset(0 0 ${Math.max(0, innerHeight - e.top)}px 0)`;
    el.style.top = e.top + 'px';
    const dist = e.top + el.offsetHeight + 30;
    flights.push(el.animate(
      [{ transform: 'translateY(0)' }, { transform: `translateY(${-dist}px)` }],
      { duration: dist / SPEED * 1000, easing: 'linear', fill: 'forwards' }));
  }
  /* ---------- Hearts: rise from the bottom and leave through the top, ~2 s in total ---------- */
  const heartBox = document.getElementById('hearts');
  const HEART_AT = STARTS[STARTS.length - 1];          // "عطيتك قلبي وكمان"
  const HEART_SVG = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 4.5 6.3 4.5c2 0 3.7 1.1 5.7 3.2 2-2.1 3.7-3.2 5.7-3.2 3.7 0 5.4 3.9 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  let heartsDone = false;
  function hearts() {
    const H = innerHeight, W = innerWidth;
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('div'); el.className = 'heart'; el.innerHTML = HEART_SVG;
      const size = 14 + Math.random() * 22, sway = (Math.random() - .5) * 60;
      el.style.cssText = `left:${Math.random() * (W - size)}px;top:${H + 10}px;width:${size}px;height:${size}px`;
      heartBox.appendChild(el);
      el.animate([
        { transform: 'translate(0,0)', opacity: 0 },
        { transform: `translate(${sway / 2}px,${-H * .12}px)`, opacity: 1, offset: .1 },
        { transform: `translate(${-sway / 2}px,${-H * .6}px)`, opacity: 1, offset: .6 },
        { transform: `translate(${sway}px,${-(H + size + 30)}px)`, opacity: 1 }
      ], { duration: 1500, delay: Math.random() * 500, easing: 'linear', fill: 'both' })   // 0.5s stagger + 1.5s rise = 2s
        .onfinish = () => el.remove();
    }
  }

  function render(t) {
    STARTS.forEach((s, i) => { if (!launched[i] && t >= s - LEAD) { launched[i] = true; launch(i); } });
    if (!heartsDone && t >= HEART_AT) { heartsDone = true; hearts(); }
  }

  /* ---------- Blue sound line: flat in silence, rises with the music ---------- */
  const cv = document.getElementById('scope'), cx = cv.getContext('2d');
  const WAVE = (() => {
    const bin = atob(WAVE_B64), a = new Float32Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = ((bin.charCodeAt(i) << 24) >> 24) / 127;
    return a;
  })();
  let gain = 0;
  function sample(sec) {
    const x = sec * WAVE_RATE, i = Math.floor(x);
    if (i < 0 || i + 1 >= WAVE.length) return 0;
    const f = x - i; return WAVE[i] * (1 - f) + WAVE[i + 1] * f;
  }
  function drawScope() {
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
    const playing = !audio.paused && !audio.ended;
    gain += ((playing ? 1 : 0) - gain) * (playing ? 0.12 : 0.06);
    const t = audio.currentTime, mid = H / 2 - 4, amp = H * 0.36, N = Math.max(40, Math.floor(W / 3));
    cx.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N, v = sample(t - 0.38 + u * 0.5);
      const taper = Math.pow(Math.sin(Math.PI * u), 1.1);
      const y = mid - Math.sign(v) * Math.pow(Math.abs(v), 0.75) * amp * taper * gain;
      i ? cx.lineTo(u * W, y) : cx.moveTo(0, y);
    }
    cx.lineJoin = 'round'; cx.lineWidth = 2.2; cx.strokeStyle = '#4da3ff';
    cx.shadowColor = 'rgba(77,163,255,.9)'; cx.shadowBlur = 12;
    cx.stroke();
    requestAnimationFrame(drawScope);
  }
  drawScope();

  /* ---------- Playback ---------- */
  let state = 'closed';        // closed → playing → ended

  function fadeIn(to, ms) {
    audio.volume = 0;
    const t0 = performance.now();
    (function step(t) {
      const k = Math.min((t - t0) / ms, 1);
      audio.volume = to * k;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  function tick() {
    render(audio.currentTime);
    if (!audio.paused && !audio.ended) requestAnimationFrame(tick);
  }
  audio.addEventListener('play', () => requestAnimationFrame(tick));
  audio.addEventListener('ended', () => { state = 'ended'; });

  function play() {
    state = 'playing';
    flights.forEach(a => a.cancel()); flights.length = 0; launched.fill(false);
    heartsDone = false; heartBox.innerHTML = '';
    audio.currentTime = 0;
    audio.play().then(() => fadeIn(0.9, 1500)).catch(() => {});
  }

  function useEnvelope() {
    if (state === 'closed') {
      env.classList.add('open');                     // flap opens, letter grows a little and stays centred
      play();                                        // song starts as the letter opens
      setTimeout(() => sigEl.classList.add('show'), 1200);
    } else if (state === 'ended') {
      play();
    }
  }
  env.addEventListener('click', useEnvelope);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); useEnvelope(); } });

  document.getElementById('open').addEventListener('click', () => {
    document.getElementById('intro').style.opacity = 0;
    setTimeout(() => {
      document.getElementById('intro').classList.add('hidden');
      cv.classList.add('on'); env.classList.add('ready');
    }, 1200);
  });

  /* ---------- ?sync helper: tap once at the start of every line ---------- */
  if (location.search.includes('sync')) {
    const bar = document.createElement('div'); bar.id = 'sync'; document.body.appendChild(bar);
    let taps = [];
    const show = () => {
      bar.innerHTML = taps.length < LYRICS.length
        ? `SYNC MODE – press Open, tap the envelope, then tap anywhere (or SPACE) exactly when line <b>${taps.length + 1}</b> starts: <b dir="rtl">${LYRICS[taps.length]}</b>`
        : `Done. Copy this and send it back:<textarea readonly>const STARTS = [${taps.join(', ')}];</textarea>`;
    };
    show();
    const tap = () => {
      if (audio.paused || taps.length >= LYRICS.length) return;
      taps.push(+audio.currentTime.toFixed(2)); show();
    };
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tap(); } });
    document.addEventListener('pointerdown', e => { if (e.target.closest('#env') || e.target.id === 'open' || e.target.tagName === 'TEXTAREA') return; tap(); });
  }
</script>
</body>
</html>
